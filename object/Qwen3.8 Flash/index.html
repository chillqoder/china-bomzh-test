<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="title">the fisherman — procedural low&#8209;poly study</div>
<div id="err">Could not load Three.js from the CDN — check the network connection and reload.</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

document.getElementById('hint') &&
  setTimeout(() => document.getElementById('hint').classList.add('gone'), 7000);

/* =========================================================================
   0 · UTILITIES
   ========================================================================= */
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
/* local Y-axis vector after an euler rotation (used to chain tapered segments) */
function up(len, rot) {
  return new V3(0, len, 0).applyEuler(new THREE.Euler(rot[0], rot[1], rot[2], 'XYZ'));
}

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20240612);
const rr = (lo, hi) => lo + rnd() * (hi - lo);

const _colCache = new Map();
function col(hex) {
  let c = _colCache.get(hex);
  if (!c) { c = new THREE.Color(hex); _colCache.set(hex, c); }
  return c;
}
const WHITE = new THREE.Color(0xffffff);
function shade(hex, k) { return col(hex).clone().multiplyScalar(k); }

/* facet colouring: tops brighter, undersides darker → readable silhouette */
function facet(base, o = {}) {
  const top = o.top ?? 1.07, bot = o.bot ?? 0.76, front = o.front ?? 1.03,
        back = o.back ?? 0.88, side = o.side ?? 0.97, jitter = o.jitter ?? 0;
  return (n) => {
    let k;
    if (n.y > 0.55) k = top; else if (n.y < -0.55) k = bot;
    else if (n.z > 0.55) k = front; else if (n.z < -0.55) k = back;
    else k = side;
    if (jitter) k *= 1 + rr(-jitter, jitter);
    return shade(base, k);
  };
}

/* ---- procedural geometry shorthands ---- */
function prismGeo(wb, db, wt, dt, h, dx = 0, dz = 0, twist = 0) {
  const b = [[-wb, 0, -db], [wb, 0, -db], [wb, 0, db], [-wb, 0, db]];
  const ct = Math.cos(twist), st = Math.sin(twist);
  const t = [[-wt, -dt], [wt, -dt], [wt, dt], [-wt, dt]]
    .map(p => [p[0] * ct - p[1] * st + dx, h, p[0] * st + p[1] * ct + dz]);
  const P = [];
  const push = (v) => P.push(v[0], v[1], v[2]);
  const tri = (a, b2, c) => { push(a); push(b2); push(c); };
  const quad = (a, b2, c, d) => { tri(a, b2, c); tri(a, c, d); };
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; quad(b[i], b[j], t[j], t[i]); }
  tri(t[0], t[1], t[2]); tri(t[0], t[2], t[3]);
  tri(b[0], b[3], b[2]); tri(b[0], b[2], b[1]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.computeVertexNormals();
  return g;
}
const G = {
  box:  (w, h, d) => new THREE.BoxGeometry(w, h, d),
  cyl:  (rb, rt, h, s = 8, open = false) => new THREE.CylinderGeometry(rt, rb, h, s, 1, open),
  cone: (r, h, s = 5) => new THREE.ConeGeometry(r, h, s),
  ico:  (r, d = 0) => new THREE.IcosahedronGeometry(r, d),
  dod:  (r) => new THREE.DodecahedronGeometry(r, 0),
  oct:  (r) => new THREE.OctahedronGeometry(r, 0),
  sph:  (r, ws = 7, hs = 5) => new THREE.SphereGeometry(r, ws, hs),
  tor:  (r, t, rs = 4, ts = 9, arc = Math.PI * 2) => new THREE.TorusGeometry(r, t, rs, ts, arc),
  ring: (i, o, s = 12) => new THREE.RingGeometry(i, o, s),
  prism: prismGeo,
};
function jitterGeo(g, amt, seed = 7) {
  const r = mulberry32(seed);
  const p = g.attributes.position, map = new Map();
  for (let i = 0; i < p.count; i++) {
    const key = `${p.getX(i).toFixed(3)}|${p.getY(i).toFixed(3)}|${p.getZ(i).toFixed(3)}`;
    let d = map.get(key);
    if (!d) { d = [(r() - .5) * 2 * amt, (r() - .5) * 2 * amt, (r() - .5) * 2 * amt]; map.set(key, d); }
    p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]);
  }
  p.needsUpdate = true; g.computeVertexNormals();
  return g;
}
/* cylinder between two points (used for the rod blank & limbs on a curve) */
function segGeo(a, b, r1, r2, seg = 5) {
  const dir = new V3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r2, r1, len, seg, 1, false);
  const q = new THREE.Quaternion().setFromUnitVectors(new V3(0, 1, 0), dir.clone().normalize());
  const m = new THREE.Matrix4().compose(
    new V3().addVectors(a, b).multiplyScalar(.5), q, new V3(1, 1, 1));
  g.applyMatrix4(m);
  return g;
}

/* ---- mesh builder: merges primitives into one flat-shaded vertex-coloured mesh ---- */
const _A = new V3(), _B = new V3(), _C = new V3(), _N = new V3(),
      _E1 = new V3(), _E2 = new V3(), _CT = new V3();
class MB {
  constructor() { this.p = []; this.c = []; }
  add(geo, o = {}) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const pos = o.pos || [0, 0, 0];
    const rot = o.rot || [0, 0, 0];
    const s = Array.isArray(o.scale) ? o.scale : [o.scale ?? 1, o.scale ?? 1, o.scale ?? 1];
    const m = new THREE.Matrix4().compose(
      new V3(pos[0], pos[1], pos[2]),
      new THREE.Quaternion().setFromEuler(new THREE.Euler(rot[0], rot[1], rot[2], o.order || 'XYZ')),
      new V3(s[0], s[1], s[2]));
    g.applyMatrix4(m);
    const a = g.attributes.position.array;
    for (let i = 0; i < a.length; i += 9) {
      _A.set(a[i], a[i + 1], a[i + 2]);
      _B.set(a[i + 3], a[i + 4], a[i + 5]);
      _C.set(a[i + 6], a[i + 7], a[i + 8]);
      _E1.subVectors(_B, _A); _E2.subVectors(_C, _A); _N.crossVectors(_E1, _E2).normalize();
      _CT.addVectors(_A, _B).add(_C).multiplyScalar(1 / 3);
      const cc = resCol(o.color, _N, _CT);
      this.p.push(_A.x, _A.y, _A.z, _B.x, _B.y, _B.z, _C.x, _C.y, _C.z);
      this.c.push(cc.r, cc.g, cc.b, cc.r, cc.g, cc.b, cc.r, cc.g, cc.b);
    }
    g.dispose();
    return this;
  }
  /* irregular slab with a clearly visible edge and thickness */
  slab(pts, o = {}) {
    const yT = o.yTop ?? 0, yB = o.yBot ?? 0;
    const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length;
    const cz = pts.reduce((s, p) => s + p.z, 0) / pts.length;
    const cy = pts.reduce((s, p) => s + (p.yt ?? 0), 0) / pts.length;
    const P = pts.map(p => ({
      t: new V3(p.x, yT + (p.yt ?? 0) + (p.gt ?? 0), p.z),
      b: new V3(p.x, yB + (p.yb ?? 0), p.z),
    }));
    const cenT = new V3(cx, yT + cy, cz), cenB = new V3(cx, yB + (o.ybC ?? 0), cz);
    const tri = (a, b, c, colorFn) => {
      _E1.subVectors(b, a); _E2.subVectors(c, a); _N.crossVectors(_E1, _E2).normalize();
      _CT.addVectors(a, b).add(c).multiplyScalar(1 / 3);
      const cc = resCol(colorFn, _N, _CT);
      this.p.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      this.c.push(cc.r, cc.g, cc.b, cc.r, cc.g, cc.b, cc.r, cc.g, cc.b);
    };
    for (let i = 0; i < P.length; i++) {
      const j = (i + 1) % P.length;
      tri(cenT, P[i].t, P[j].t, o.topCol ?? o.color);
      tri(P[i].t, P[j].t, P[j].b, o.sideCol ?? o.color);
      tri(P[i].t, P[j].b, P[i].b, o.sideCol ?? o.color);
      if (o.bottom !== false) tri(cenB, P[j].b, P[i].b, o.botCol ?? o.color);
    }
    return this;
  }
  build(mat, opts = {}) {
    const g = new THREE.BufferGeometry();
    if (!this.p.length) return null;
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeVertexNormals();
    const mesh = new THREE.Mesh(g, mat);
    mesh.castShadow = opts.cast !== false;
    mesh.receiveShadow = opts.receive !== false;
    if (opts.name) mesh.name = opts.name;
    return mesh;
  }
}
function resCol(c, n, ctr) {
  if (c == null) return WHITE;
  if (typeof c === 'function') return c(n, ctr);
  if (c.isColor) return c;
  return col(c);
}

/* ---- materials (solid colours, flat shading) ---- */
const MAT = {
  body:  new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .93, metalness: 0 }),
  rub:   new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .55, metalness: .04 }),
  metal: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .3, metalness: .78 }),
  env:   new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .97, metalness: 0 }),
  water: new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: .42, metalness: .05 }),
  line:  new THREE.MeshStandardMaterial({ color: 0xeef1ea, roughness: .5, metalness: 0, flatShading: false }),
};

/* =========================================================================
   1 · PALETTE
   ========================================================================= */
const PL = {
  bg: 0xe8e4da,
  skin: 0xdba377, skinWarm: 0xdf9d66, skinDark: 0xb77f52,
  beard: 0x8f8172, beardDk: 0x746659, brow: 0x6b5a4b,
  eyeWhite: 0xf4efe4, pupil: 0x2b2119, lip: 0x9c5f4c,
  hat: 0x7e8858, hatDk: 0x66703f, band: 0x4c5236,
  shirt: 0xc9963f, shirtLt: 0xd9aa5c, shirtDk: 0xa87a33,
  vest: 0x707b4e, vestDk: 0x5b6541, vestTrim: 0x49522f,
  pants: 0x6b5238, pantsDk: 0x50402c, pantsLt: 0x7d6244,
  boot: 0x38443a, bootDk: 0x2a342c, sole: 0x22261f,
  belt: 0x3b2a1d, brass: 0xb9a24c,
  rod: 0x4a3b33, rodDk: 0x2c2522, cork: 0xc2a074, corkDk: 0xa8865d,
  reel: 0xb4bcc0, reelDk: 0x6f787d, spoolLine: 0x8fa9a4,
  line: 0xeef1ea,
  floatRed: 0xc64231, floatWhite: 0xf5f1e6,
  water: 0x3d8084, waterDk: 0x2b5f66,
  earth: 0x7c5c3b, earthDk: 0x5c4227, dirt: 0x7b6244,
  grass: 0x6f8f42, grassDk: 0x55702f, grassLt: 0x8fae51,
  rock: 0x8d9192, rockDk: 0x6f7375, moss: 0x748a4a,
  reed: 0x7d8a4b, reedDk: 0x5f6b38, mace: 0x6a4a2c,
  bucket: 0x8f9ba0, bucketDk: 0x6b767a,
};

/* =========================================================================
   2 · RENDERER · SCENE · CAMERA · LIGHTS
   ========================================================================= */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PL.bg);
scene.fog = new THREE.Fog(PL.fog ?? 0xe4e0d5, 9.5, 26);

const camera = new THREE.PerspectiveCamera(41, window.innerWidth / window.innerHeight, .05, 120);
camera.position.set(2.6, 1.58, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.12, 0.98, 0.45);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.minDistance = 1.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * .495;
controls.minPolarAngle = Math.PI * .06;
controls.enablePan = false;
controls.rotateSpeed = .85;
controls.update();

/* soft warm daylight */
const hemi = new THREE.HemisphereLight(0xf2ece0, 0x8d7a5c, 1.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d6, 2.6);
sun.position.set(3.4, 5.4, 2.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = .5;
sun.shadow.camera.far = 16;
sun.shadow.camera.left = -3.4; sun.shadow.camera.right = 3.4;
sun.shadow.camera.top = 3.4; sun.shadow.camera.bottom = -3.4;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.018;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0.1, .7, .4);

const fill = new THREE.DirectionalLight(0xcfe2ea, .75);
fill.position.set(-3.2, 2.4, -2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe6c2, .6);
rim.position.set(-1.2, 1.6, -4.2);
scene.add(rim);

/* =========================================================================
   3 · DIORAMA  (riverbank, water, rocks, grass, reeds, bucket)
   ========================================================================= */
const WORLD_UP = 0.0;            // grass surface level the fisherman stands on
const WATER_Y = -0.06;           // water surface

function blob(cx, cz, rBase, rVar, n, seed, sx = 1, sz = 1, flat = 0) {
  const r = mulberry32(seed), ph = r() * 6.28, out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + ph;
    const wob = 1 + rVar * (0.55 * Math.sin(a * 2.3 + seed) + 0.3 * Math.sin(a * 3.7 + seed * 1.7)
                              + 0.24 * Math.sin(a * 5.1 + seed * .7));
    const rad = Math.max(.2, rBase * wob);
    out.push({
      x: cx + Math.cos(a) * rad * sx,
      z: cz + Math.sin(a) * rad * sz,
      gt: flat ? (r() - .5) * flat : 0,
      yt: (r() - .5) * .012,
      yb: (r() - .5) * .02,
    });
  }
  return out;
}

const env = new THREE.Group();
scene.add(env);

/* --- water --- */
{
  const mb = new MB();
  mb.slab(blob(0.15, 2.5, 2.3, .1, 22, 11, 2.05, 1.0, .012), {
    yTop: WATER_Y, yBot: WATER_Y - .4,
    topCol: facet(PL.water, { top: 1.06, side: .96, bot: .68, jitter: .05 }),
    sideCol: facet(PL.waterDk, { top: .9, side: .8, bot: .55 }),
    botCol: shade(PL.waterDk, .5),
  });
  env.add(mb.build(MAT.water, { cast: false, name: 'water' }));
}

/* --- earthen bank with visible edge + thickness --- */
{
  const mb = new MB();
  const prof = blob(-0.05, -0.55, 1.0, .16, 20, 5, 1.28, 1.0);
  mb.slab(prof, {
    yTop: -0.012, yBot: -0.24,
    topCol: facet(PL.earth, { top: 1.05, side: .95, bot: .7, jitter: .05 }),
    sideCol: facet(PL.earthDk, { top: 1.05, side: .95, bot: .72, jitter: .07 }),
    botCol: shade(PL.earthDk, .6),
  });
  env.add(mb.build(MAT.env, { cast: false, name: 'bank-earth' }));

  /* grassy top layer, slightly inset so the earth edge reads underneath */
  const gm = new MB();
  const gp = blob(-0.05, -0.55, 0.94, .13, 20, 5, 1.24, 1.0, .018);
  gm.slab(gp, {
    yTop: WORLD_UP, yBot: -0.028,
    topCol: facet(PL.grass, { top: 1.06, side: 1.0, bot: .78, jitter: .06 }),
    sideCol: facet(PL.grassDk, { top: 1.0, side: .85, bot: .6 }),
    botCol: shade(PL.grassDk, .6),
  });
  env.add(gm.build(MAT.env, { cast: false, name: 'bank-grass' }));

  /* trampled patch of earth around the fishing spot */
  const dm = new MB();
  dm.slab(blob(0.02, -0.32, .44, .22, 14, 9, 1.3, 1.0, .01), {
    yTop: WORLD_UP + 0.003, yBot: WORLD_UP - .03,
    topCol: facet(PL.dirt, { top: .96, side: .92, bot: .74, jitter: .05 }),
    sideCol: facet(PL.earth, { top: .74, side: .66, bot: .5 }),
  });
  env.add(dm.build(MAT.env, { cast: false, name: 'bank-dirt' }));
}

/* --- shoreline stones & angular rocks --- */
{
  const mb = new MB();
  const stoneSpots = [
    [ 0.62, 0.44, .07], [-0.46, 0.40, .085], [ 0.16, 0.5, .06],
    [-0.82, 0.14, .09], [ 0.92, 0.0, .075], [-0.2, 0.54, .05],
    [ 0.54, -0.46, .065], [-0.86, -0.4, .075], [-1.12, -0.08, .065],
  ];
  stoneSpots.forEach(([x, z, s], i) => {
    const g = jitterGeo(G.ico(s, 0), s * .28, 40 + i);
    mb.add(g, {
      pos: [x, WORLD_UP - s * .35, z],
      rot: [rr(-.4, .4), rr(0, 3), rr(-.3, .3)],
      scale: [1, rr(.45, .7), rr(.8, 1.1)],
      color: facet(PL.rock, { top: 1.05, side: .96, bot: .62, jitter: .07 }),
    });
  });

  const rocks = [
    { x:  0.76, z: 0.30, s: .125, sy: .74, seed: 71 },
    { x: -0.78, z: 0.0, s: .15, sy: .76, seed: 72 },
    { x:  0.36, z: -0.74, s: .115, sy: .7, seed: 73 },
    { x: -0.28, z: 0.44, s: .095, sy: .7, seed: 74 },
    { x:  0.94, z: -0.36, s: .105, sy: .64, seed: 75 },
    { x: -0.92, z: -0.46, s: .13, sy: .68, seed: 76 },
  ];
  rocks.forEach((r, i) => {
    const g = jitterGeo(G.ico(r.s, 0), r.s * .3, r.seed);
    mb.add(g, {
      pos: [r.x, -r.s * .42, r.z],
      rot: [rr(-.25, .25), rr(0, 3.14), rr(-.2, .2)], scale: [rr(.9, 1.25), r.sy, rr(.85, 1.15)],
      color: (n) => {
        if (n.y > .55) return shade(i % 2 ? PL.moss : PL.rock, 1.02);   // mossy tops
        if (n.y < -.5) return shade(PL.rockDk, .62);
        return shade(n.z > .4 ? PL.rock : PL.rockDk, .95);
      },
    });
  });
  env.add(mb.build(MAT.env, { name: 'rocks' }));
}

/* --- grass clusters --- */
{
  const mb = new MB();
  const spots = [
    [-0.26, 0.3], [0.3, 0.36], [-0.64, 0.14], [0.7, -0.06], [-0.5, -0.5],
    [0.12, -0.66], [0.86, -0.54], [-0.88, -0.12], [0.5, -0.24], [-0.1, -0.9],
    [-0.78, 0.38], [0.64, 0.5],
  ];
  spots.forEach(([bx, bz], si) => {
    const n = 3 + Math.floor(rr(0, 3));
    for (let b = 0; b < n; b++) {
      const a = rr(0, 6.28), lean = rr(.16, .5), h = rr(.07, .13);
      const x = bx + Math.cos(a) * rr(0, .09), z = bz + Math.sin(a) * rr(0, .09);
      const l1 = h * .58, l2 = h * .5;
      const r0 = [Math.cos(a) * lean, 0, -Math.sin(a) * lean];

/* =========================================================================
   6 · TWO-BONE IK  (keeps both hands welded to the rod)
   ========================================================================= */
const NEG_Y = new V3(0, -1, 0);
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _m3 = new THREE.Matrix4();

function aim(obj, dir) {
  _q1.setFromUnitVectors(NEG_Y, dir.clone().normalize());
  obj.parent.getWorldQuaternion(_q2).invert();
  obj.quaternion.multiplyQuaternions(_q2, _q1);
}

function solveArm(arm, target, rodDir) {
  const S = arm.sh.getWorldPosition(new V3());
  const L1 = K.upper, L2 = K.fore;
  const to = new V3().copy(target).sub(S);
  const dist = clamp(to.length(), Math.abs(L1 - L2) + .06, (L1 + L2) * .975);
  const u = to.clone().normalize();

  const cosS = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
  const aS = Math.acos(clamp(cosS, -1, 1));

  let pole = arm.pole.clone().sub(S);
  pole.addScaledVector(u, -pole.dot(u));
  if (pole.lengthSq() < 1e-7) pole.set(0, -1, -.2);
  pole.normalize();

  const elbowDir = u.clone().multiplyScalar(Math.cos(aS))
    .addScaledVector(pole, Math.sin(aS)).normalize();
  const elbow = S.clone().addScaledVector(elbowDir, L1);
  const foreDir = new V3().copy(target).sub(elbow).normalize();

  aim(arm.sh, elbowDir);
  aim(arm.elb, foreDir);

  /* hand: local +Y along the rod, local +Z along the forearm */
  const gY = rodDir.clone();
  gY.addScaledVector(foreDir, -gY.dot(foreDir));
  if (gY.lengthSq() < 1e-8) gY.set(0, 1, 0);
  gY.normalize();
  const gX = new V3().crossVectors(gY, foreDir).normalize();
  _m3.makeBasis(gX, gY, foreDir);
  _q1.setFromRotationMatrix(_m3);
  arm.wri.parent.getWorldQuaternion(_q2).invert();
  arm.wri.quaternion.multiplyQuaternions(_q2, _q1);
}

/* =========================================================================
   7 · POSE  (feet planted, torso lean, head toward the line)
   ========================================================================= */
const pose = {
  spine: { x: -.055, y: .0, z: .015 },
  neck: { x: -.075, y: .22, z: -.03 },
  head: { x: -.05, y: .10, z: .0 },
  legR: { hip: -.085, knee: .17, ankle: -.085 },
  legL: { hip: -.175, knee: .30, ankle: .0 },
  rod: { x: ROD.tilt, y: ROD.yaw, z: ROD.lean },
};

function setLeg(leg, p) {
  leg.hip.rotation.x = p.hip;
  leg.knee.rotation.x = p.knee;
  leg.ankle.rotation.x = -(p.hip + p.knee);      // keeps the sole flat on the bank
}

function soleY(leg) {
  rig.root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(leg.boot);
  return box.min.y;
}
/* numerically adapt each hip pitch so both soles rest exactly on the ground */
function plantFoot(leg, p, target) {
  for (let it = 0; it < 5; it++) {
    setLeg(leg, p);
    const f0 = soleY(leg) - target;
    const d = .02;
    p.hip += d; setLeg(leg, p);
    const f1 = soleY(leg) - target;
    p.hip -= d;
    const den = (f1 - f0) / d;
    if (Math.abs(den) < 1e-5) break;
    p.hip += clamp(-f0 / den, -.12, .12);
    if (Math.abs(f0) < 1e-4) break;
  }
  setLeg(leg, p);
}
plantFoot(rig.legR, pose.legR, 0);
plantFoot(rig.legL, pose.legL, 0);

rig.spine.rotation.set(pose.spine.x, pose.spine.y, pose.spine.z);
rig.neck.rotation.set(pose.neck.x, pose.neck.y, pose.neck.z);
rig.head.rotation.set(pose.head.x, pose.head.y, pose.head.z);
rodPivot.rotation.set(pose.rod.x, pose.rod.y, pose.rod.z);
rig.root.updateMatrixWorld(true);

/* rod direction in world space at the grips (ignores the small bend) */
function rodWorldDir(out) {
  rodBody.getWorldQuaternion(_q2);
  return out.set(0, 1, 0).applyQuaternion(_q2).normalize();
}

/* elbow poles: elbows out, down and slightly back */
function updatePoles() {
  const S_R = rig.armR.sh.getWorldPosition(new V3());
  const S_L = rig.armL.sh.getWorldPosition(new V3());
  rig.armR.pole.copy(S_R).add(new V3(-.40, -.30, -.30));
  rig.armL.pole.copy(S_L).add(new V3( .42, -.26, -.34));
}

/* =========================================================================
   8 · FISHING LINE  (threads the guides, drops to the float)
   ========================================================================= */
let lineMeshGeo = null;
function updateLine() {
  const pts = [];
  const q = rodBody.getWorldQuaternion(new THREE.Quaternion());
  const wpt = (v) => rodBody.localToWorld(v.clone());

  /* from the spool, along the guides, to the tip, then down to the float */
  pts.push(wpt(new V3(0, .30, .14)));
  [2, 5, 8, 11, 13].forEach((i) => {
    const d = rodDirs[i], perp = new V3(0, -d.y, d.x);
    pts.push(wpt(rodPts[i].clone().addScaledVector(perp, .021)));
  });
  const dLast = rodDirs[rodDirs.length - 1], perpLast = new V3(0, -dLast.y, dLast.x);
  const tipW = wpt(rodTip.clone().addScaledVector(perpLast, .012).addScaledVector(dLast, .02));
  pts.push(tipW);

  const floatTopW = new V3(floatGrp.position.x, floatGrp.position.y + .16, floatGrp.position.z);
  const mid = tipW.clone().lerp(floatTopW, .45);
  mid.y -= .18;                                   // slack
  mid.x += .05;
  pts.push(mid, floatTopW);

  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', .35);
  const g = new THREE.TubeGeometry(curve, 46, .0035, 4, false);
  if (lineMeshGeo) lineMeshGeo.dispose();
  lineObj.geometry = g;
  lineMeshGeo = g;
}

/* =========================================================================
   9 · ANIMATION
   ========================================================================= */
const clock = new THREE.Clock();
let seekT = null;                     // set by the debug helper for still frames
const _dir = new V3();
const t1 = new V3(), t2 = new V3();

function tick() {
  const t = seekT === null ? clock.getElapsedTime() : seekT;

  /* breathing */
  const br = Math.sin(t * .95);
  rig.spine.rotation.x = pose.spine.x - .012 * br;
  rig.spine.rotation.z = pose.spine.z + .006 * Math.sin(t * .63);
  rig.spine.position.y = K.spineY + .006 * br;
  rig.hips.rotation.z = .004 * Math.sin(t * .63);

  /* head drifts a touch, still looking along the line */
  rig.neck.rotation.y = pose.neck.y + .025 * Math.sin(t * .41 + 1.2);
  rig.head.rotation.x = pose.head.x - .014 * br;
  rig.head.rotation.z = pose.head.z + .012 * Math.sin(t * .33);

  /* rod: slow coordinated sway + a fine tip tremor; hands follow via IK */
  const s1 = Math.sin(t * .78), s2 = Math.sin(t * .53 + .8), s3 = Math.sin(t * 2.3 + 1.4);
  rodPivot.rotation.x = pose.rod.x + .018 * s1 + .005 * s3;
  rodPivot.rotation.z = pose.rod.z + .012 * s2;
  rodPivot.rotation.y = pose.rod.y + .010 * Math.sin(t * .47);
  rodPivot.position.z = ROD.butt.z + .006 * s1;
  rodPivot.position.y = ROD.butt.y + .004 * br;

  rig.root.updateMatrixWorld(true);
  updatePoles();

  const rd = rodWorldDir(_dir);
  solveArm(rig.armR, rodBody.localToWorld(t1.copy(GRIP_R)), rd);
  solveArm(rig.armL, rodBody.localToWorld(t2.copy(GRIP_L)), rd);

  /* float bob + ripples */
  floatGrp.position.y = FLOAT_HOME.y + .012 * Math.sin(t * 1.35 + .4);
  floatGrp.rotation.z = .07 * Math.sin(t * 1.1);
  floatGrp.rotation.x = .05 * Math.sin(t * .87 + 1.1);

  ripples.forEach((r) => {
    const cycle = ((t * .34 + r.userData.phase) % 1);
    const k = .35 + cycle * 3.6;
    r.scale.set(k, 1, k);
    r.material.opacity = .34 * (1 - cycle) * Math.min(1, cycle * 8);
  });

  updateLine();

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* =========================================================================
   10 · RESIZE
   ========================================================================= */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
onResize();

/* first line build, then run */
rig.root.updateMatrixWorld(true);
updateLine();
tick();

/* expose a tiny debug handle (keeps the interface otherwise empty) */
window.__fisherman = { scene, camera, rig, rodBody, THREE };
window.__cam = (px, py, pz, tx, ty, tz) => {
  camera.position.set(px, py, pz);
  controls.target.set(tx, ty, tz);
  controls.update();
  renderer.render(scene, camera);
};
window.__seek = (t) => { seekT = t; };
</script>
<script>
  /* surface a friendly message if the module (CDN) fails to load */
  window.addEventListener('error', (e) => {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      document.getElementById('err').style.display = 'flex';
    }
  }, true);
  setTimeout(() => {
    if (!window.__fisherman) document.getElementById('err').style.display = 'flex';
  }, 8000);
</script>
</body>
