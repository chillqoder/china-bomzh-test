function addMesh(parent, geo, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function box(parent, w, h, d, material, x = 0, y = 0, z = 0) {
  return addMesh(parent, new THREE.BoxGeometry(w, h, d), material, x, y, z);
}

function cyl(parent, rTop, rBottom, h, material, x = 0, y = 0, z = 0, seg = 7, open = false, thetaStart = 0, thetaLength = Math.PI * 2) {
  return addMesh(parent, new THREE.CylinderGeometry(rTop, rBottom, h, seg, 1, open, thetaStart, thetaLength), material, x, y, z);
}

function sph(parent, r, material, x = 0, y = 0, z = 0, ws = 8, hs = 6) {
  return addMesh(parent, new THREE.SphereGeometry(r, ws, hs), material, x, y, z);
}

function seg(parent, a, b, rA, rB, material, rs = 7) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = addMesh(parent, new THREE.CylinderGeometry(rB, rA, len, rs, 1), material, (a.x + b.x) / 2, (a.y + b.y) / 2, (a.z + b.z) / 2);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function solveElbow(S, T, l1, l2, poleDir) {
  const d = new THREE.Vector3().subVectors(T, S);
  const dist = Math.min(d.length(), (l1 + l2) * 0.999);
  const n = d.clone().normalize();
  const a = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(l1 * l1 - a * a, 0));
  const mid = S.clone().addScaledVector(n, a);
  const p = poleDir.clone().addScaledVector(n, -poleDir.dot(n));
  if (p.lengthSq() < 1e-6) p.set(0, -1, 0);
  p.normalize();
  return mid.addScaledVector(p, h);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function circlePoints(cx, cz, radius, n, jitter) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = radius * (1 + (rng() * 2 - 1) * jitter);
    pts.push([cx + Math.cos(a) * r, cz + Math.sin(a) * r]);
  }
  return pts;
}

function shapeFrom(pts) {
  const s = new THREE.Shape();
  pts.forEach((p, i) => (i ? s.lineTo(p[0], -p[1]) : s.moveTo(p[0], -p[1])));
  s.closePath();
  return s;
}

function pathFrom(pts) {
  const p = new THREE.Path();
  pts.forEach((q, i) => (i ? p.lineTo(q[0], -q[1]) : p.moveTo(q[0], -q[1])));
  p.closePath();
  return p;
}

  const stem = cyl(rod, 0.0038, 0.0038, 0.02, MAT.reel, 0, gy, 0.016, 5);
  stem.rotation.x = Math.PI / 2;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(gr, 0.0032, 4, 10), MAT.reel);
  ring.position.set(0, gy, 0.027);
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = true;
  rod.add(ring);
  const anchor = new THREE.Object3D();
  anchor.position.set(0, gy, 0.027);
  rod.add(anchor);
  guideAnchors.push(anchor);
}

const reelStem = cyl(rod, 0.011, 0.011, 0.036, MAT.reel, 0, 0.455, -0.033, 6);
reelStem.rotation.x = Math.PI / 2;
const reelBody = cyl(rod, 0.027, 0.027, 0.05, MAT.reel, 0, 0.455, -0.076, 8);
reelBody.rotation.x = Math.PI / 2;
const reelSpool = cyl(rod, 0.023, 0.023, 0.035, MAT.spool, 0, 0.455, -0.116, 8);
reelSpool.rotation.x = Math.PI / 2;
const spoolLip = cyl(rod, 0.0275, 0.0275, 0.006, MAT.spool, 0, 0.455, -0.133, 8);
spoolLip.rotation.x = Math.PI / 2;
const bail = new THREE.Mesh(new THREE.TorusGeometry(0.027, 0.0028, 4, 9, Math.PI * 1.35), MAT.crank);
bail.position.set(0, 0.455, -0.138);
bail.rotation.z = -Math.PI * 0.35;
bail.castShadow = true;
rod.add(bail);
box(rod, 0.042, 0.007, 0.008, MAT.crank, -0.037, 0.455, -0.105);
const crankKnob = cyl(rod, 0.008, 0.008, 0.02, MAT.crank, -0.058, 0.455, -0.112, 6);
crankKnob.rotation.x = Math.PI / 2;
const spoolAnchor = new THREE.Object3D();
spoolAnchor.position.set(0, 0.455, -0.12);
rod.add(spoolAnchor);

function makeHand(sign) {
  const hand = new THREE.Group();
  const thetaP = sign < 0 ? Math.PI / 2 : -Math.PI / 2;
  const wrap = new THREE.Mesh(new THREE.CylinderGeometry(0.041, 0.041, 0.085, 8, 1, true, thetaP + 0.35, Math.PI * 2 - 0.7), MAT.skinWrap);
  wrap.castShadow = true;
  hand.add(wrap);
  box(hand, 0.034, 0.09, 0.058, MAT.skin, -sign * 0.044, 0, 0);
  const thumb = box(hand, 0.028, 0.03, 0.052, MAT.skin, -sign * 0.016, 0.034, 0.03);
  thumb.rotation.y = sign * 0.45;
  thumb.rotation.x = -0.12;
  return hand;
}

const rightHand = makeHand(-1);
rightHand.position.set(0, 0.26, 0);
rod.add(rightHand);
const leftHand = makeHand(1);
leftHand.position.set(0, 0.49, 0);
rod.add(leftHand);

scene.updateMatrixWorld(true);

const S_r = new THREE.Vector3(-0.205, 0.395, 0.01);
const S_l = new THREE.Vector3(0.205, 0.395, 0.01);
const T_r = upper.worldToLocal(rightHand.getWorldPosition(new THREE.Vector3()));
const T_l = upper.worldToLocal(leftHand.getWorldPosition(new THREE.Vector3()));

function buildArm(S, T, poleDir) {
  const E = solveElbow(S, T, 0.28, 0.29, poleDir);
  const dirSE = E.clone().sub(S);
  seg(upper, S.clone().addScaledVector(dirSE, 0.05), S.clone().addScaledVector(dirSE, 0.8), 0.072, 0.058, MAT.shirt);
  seg(upper, S.clone().addScaledVector(dirSE, 0.78), S.clone().addScaledVector(dirSE, 0.95), 0.066, 0.062, MAT.shirt);
  seg(upper, S.clone().addScaledVector(dirSE, 0.9), E, 0.048, 0.045, MAT.skin);
  sph(upper, 0.048, MAT.skin, E.x, E.y, E.z, 7, 5);
  const dirET = T.clone().sub(E);
  const wrist = T.clone().addScaledVector(dirET, -0.02);
  seg(upper, E, wrist, 0.047, 0.038, MAT.skin);
  sph(upper, 0.041, MAT.skin, wrist.x, wrist.y, wrist.z, 7, 5);
}

buildArm(S_r, T_r, new THREE.Vector3(-0.9, -0.35, -0.55));
buildArm(S_l, T_l, new THREE.Vector3(0.9, -0.3, -0.5));

const floatGroup = new THREE.Group();
floatGroup.position.set(-0.13, -0.045, 2.3);
scene.add(floatGroup);
cyl(floatGroup, 0.034, 0.012, 0.055, MAT.lureRed, 0, -0.02, 0, 8);
cyl(floatGroup, 0.0345, 0.0345, 0.007, MAT.pupil, 0, 0.0085, 0, 8);
cyl(floatGroup, 0.018, 0.034, 0.05, MAT.lureWhite, 0, 0.037, 0, 8);
cyl(floatGroup, 0.007, 0.0055, 0.03, MAT.lureRed, 0, 0.075, 0, 6);
const floatAnchor = new THREE.Object3D();
floatAnchor.position.set(0, 0.01, 0);
floatGroup.add(floatAnchor);

const ripples = [];
for (let i = 0; i < 3; i++) {
  const rippleMat = new THREE.MeshBasicMaterial({ color: 0xcdeae4, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide });
  const ripple = new THREE.Mesh(new THREE.RingGeometry(0.87, 1.0, 18), rippleMat);
  ripple.rotation.x = -Math.PI / 2;
  ripple.position.set(-0.13, -0.072, 2.3);
  scene.add(ripple);
  ripples.push(ripple);
}

const lineAnchors = [spoolAnchor, ...guideAnchors, tipAnchor, floatAnchor];
const lineGeo = new THREE.BufferGeometry();
const linePositions = new Float32Array(lineAnchors.length * 3);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xf2efe4, transparent: true, opacity: 0.9 }));
line.frustumCulled = false;
scene.add(line);

const tmpV = new THREE.Vector3();
function updateLine() {
  for (let i = 0; i < lineAnchors.length; i++) {
    lineAnchors[i].getWorldPosition(tmpV);
    linePositions[i * 3] = tmpV.x;
    linePositions[i * 3 + 1] = tmpV.y;
    linePositions[i * 3 + 2] = tmpV.z;
  }
  lineGeo.attributes.position.needsUpdate = true;
}

const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();
  const breath = Math.sin(t * 1.5);

  upper.rotation.x = 0.12 + 0.011 * Math.sin(t * 0.85) + 0.004 * breath;
  upper.rotation.y = -0.05 + 0.008 * Math.sin(t * 0.6 + 1.2);
  upper.position.y = 1.0 + 0.006 * breath;

  head.rotation.y = -0.24 + 0.022 * Math.sin(t * 0.7 + 0.5);
  head.rotation.x = -0.05 + 0.016 * Math.sin(t * 1.15);

  chest.scale.set(1 + 0.005 * breath, 1 + 0.011 * breath, 1 + 0.006 * breath);

  floatGroup.position.y = -0.045 + 0.013 * Math.sin(t * 2.1);
  floatGroup.rotation.z = 0.06 * Math.sin(t * 1.6 + 0.7);
  floatGroup.rotation.x = 0.05 * Math.sin(t * 1.3 + 2.1);

  ripples.forEach((ring, i) => {
    const phase = (t * 0.5 + i / 3) % 1;
    const s = 0.07 + phase * 0.45;
    ring.scale.set(s, s, 1);
    ring.material.opacity = 0.45 * (1 - phase);
  });

  scene.updateMatrixWorld(true);
  updateLine();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
