<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Garden Pond</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #c4d2da;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------
// Renderer / Scene / Camera
// ------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc4d2da, 55, 130);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 300
);
camera.position.set(18, 11.5, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 9;
controls.maxDistance = 42;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI / 2.08;
controls.enablePan = false;

// ------------------------------------------------------------------
// Sky gradient dome
// ------------------------------------------------------------------
const skyGeo = new THREE.SphereGeometry(120, 24, 16);
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x5fa4d8) },
    midColor: { value: new THREE.Color(0x9cc4dc) },
    bottomColor: { value: new THREE.Color(0xc4d2da) }
  },
  vertexShader: /* glsl */`
    varying vec3 vWorldPosition;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPosition = wp.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 bottomColor;
    varying vec3 vWorldPosition;
    void main() {
      float h = normalize(vWorldPosition).y;
      vec3 c = h > 0.0
        ? mix(midColor, topColor, clamp(h * 1.6, 0.0, 1.0))
        : mix(midColor, bottomColor, clamp(-h * 2.2, 0.0, 1.0));
      gl_FragColor = vec4(c, 1.0);
    }
  `,
  side: THREE.BackSide,
  depthWrite: false
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ------------------------------------------------------------------
// Lighting
// ------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xcfe4f5, 0x6b7a55, 0.85);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d8, 1.55);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.camera.left = -26;
sun.shadow.camera.right = 26;
sun.shadow.camera.top = 26;
sun.shadow.camera.bottom = -26;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa8c8e8, 0.35);
fill.position.set(-14, 10, -16);
scene.add(fill);

// ------------------------------------------------------------------
// Helpers
// ------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function flatMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    flatShading: true,
    roughness: 0.85,
    metalness: 0.0,
    ...opts
  });
}

function pondRadius(angle) {
  return 8.2
    + Math.sin(angle * 3.0 + 0.6) * 0.85
    + Math.sin(angle * 5.0 + 1.7) * 0.45
    + Math.cos(angle * 2.0 - 0.4) * 0.55;
}

// ------------------------------------------------------------------
// Earth base (sculpted diorama plinth with a pond opening)
// ------------------------------------------------------------------
// NOTE: shapes live in XY and are rotated -90° about X, so shape-space
// (x, y) maps to world (x, 0, -y). Pond points therefore use y = -sin(a)*r.
function pondHolePath(scale = 1) {
  const hole = new THREE.Path();
  const segs = 72;
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const r = pondRadius(a) * scale;
    const x = Math.cos(a) * r;
    const y = -Math.sin(a) * r;
    if (i === 0) hole.moveTo(x, y); else hole.lineTo(x, y);
  }
  hole.closePath();
  return hole;
}

const baseShape = new THREE.Shape();
{
  const segs = 48;
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const r = 17.5 + Math.sin(a * 4) * 1.2 + Math.cos(a * 3) * 0.9;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) baseShape.moveTo(x, y); else baseShape.lineTo(x, y);
  }
  baseShape.closePath();
  baseShape.holes.push(pondHolePath(0.995));
}
const baseGeo = new THREE.ExtrudeGeometry(baseShape, {
  depth: 1.9,
  bevelEnabled: true,
  bevelThickness: 0.35,
  bevelSize: 0.55,
  bevelSegments: 2,
  curveSegments: 48
});
baseGeo.rotateX(-Math.PI / 2);
// top of the extrusion lands at y ≈ 0
baseGeo.translate(0, -2.25, 0);
const baseMesh = new THREE.Mesh(baseGeo, flatMat(0x6f7f52, { roughness: 0.95 }));
baseMesh.receiveShadow = true;
scene.add(baseMesh);

// Soft mossy top ring around the pond
const topShape = new THREE.Shape();
{
  const segs = 48;
  for (let i = 0; i < segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const r = 16.6 + Math.sin(a * 4) * 1.0 + Math.cos(a * 3) * 0.7;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) topShape.moveTo(x, y); else topShape.lineTo(x, y);
  }
  topShape.closePath();
  topShape.holes.push(pondHolePath(1.0));
}
const topGeo = new THREE.ShapeGeometry(topShape, 48);
topGeo.rotateX(-Math.PI / 2);
const topMesh = new THREE.Mesh(topGeo, flatMat(0x7d9153, { roughness: 0.98 }));
topMesh.position.y = 0.015;
topMesh.receiveShadow = true;
scene.add(topMesh);

// ------------------------------------------------------------------
// Pond basin (underwater sand bowl)
// ------------------------------------------------------------------
const basinSegs = 72;
const basinRings = 7;
const basinPositions = [];
const basinColors = [];
const sandA = new THREE.Color(0xcbb890);
const sandB = new THREE.Color(0x9e8b64);

function basinDepth(rNorm) {
  // shallow edges, deep centre
  return -0.04 - (1.0 - rNorm * rNorm) * 1.5;
}

for (let ring = 0; ring <= basinRings; ring++) {
  const rn = ring / basinRings;
  for (let i = 0; i < basinSegs; i++) {
    const a = (i / basinSegs) * Math.PI * 2;
    const r = pondRadius(a) * rn * 0.998;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const y = basinDepth(rn) + Math.sin(a * 4 + rn * 5) * 0.04 * rn;
    basinPositions.push(x, y, z);
    const c = sandA.clone().lerp(sandB, 0.25 + rn * 0.55);
    basinColors.push(c.r, c.g, c.b);
  }
}
const basinIndices = [];
for (let ring = 0; ring < basinRings; ring++) {
  for (let i = 0; i < basinSegs; i++) {
    const i0 = ring * basinSegs + i;
    const i1 = ring * basinSegs + ((i + 1) % basinSegs);
    const i2 = (ring + 1) * basinSegs + i;
    const i3 = (ring + 1) * basinSegs + ((i + 1) % basinSegs);
    // wound so face normals point up (+Y)
    basinIndices.push(i0, i1, i2, i1, i3, i2);
  }
}
const basinGeo = new THREE.BufferGeometry();
basinGeo.setAttribute('position', new THREE.Float32BufferAttribute(basinPositions, 3));
basinGeo.setAttribute('color', new THREE.Float32BufferAttribute(basinColors, 3));
basinGeo.setIndex(basinIndices);
basinGeo.computeVertexNormals();
const basinMesh = new THREE.Mesh(basinGeo, new THREE.MeshStandardMaterial({
  vertexColors: true,
  flatShading: true,
  roughness: 0.95,
  metalness: 0
}));
basinMesh.receiveShadow = true;
scene.add(basinMesh);

// Underwater pebbles & submerged rocks
const pebbleMats = [
  flatMat(0x8c8478), flatMat(0x6f6a60), flatMat(0xa89c88), flatMat(0x5d5a52)
];
for (let i = 0; i < 34; i++) {
  const a = Math.random() * Math.PI * 2;
  const rn = Math.sqrt(Math.random()) * 0.55 + 0.35;
  const r = pondRadius(a) * Math.min(rn, 0.92);
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r;
  const y = basinDepth(rn) + 0.05;
  const s = rand(0.12, 0.42);
  const g = new THREE.IcosahedronGeometry(s, 0);
  const m = new THREE.Mesh(g, pebbleMats[i % pebbleMats.length]);
  m.position.set(x, y, z);
  m.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  m.scale.set(1, rand(0.5, 0.8), rand(0.8, 1.3));
  m.receiveShadow = true;
  scene.add(m);
}
for (let i = 0; i < 5; i++) {
  const a = rand(0, Math.PI * 2);
  const rn = rand(0.55, 0.82);
  const r = pondRadius(a) * rn;
  const s = rand(0.5, 1.0);
  const g = new THREE.DodecahedronGeometry(s, 0);
  const m = new THREE.Mesh(g, flatMat(0x5a5850));
  m.position.set(Math.cos(a) * r, basinDepth(rn) + s * 0.35, Math.sin(a) * r);
  m.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  m.scale.set(1, rand(0.55, 0.8), 1);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// ------------------------------------------------------------------
// Water surface
// ------------------------------------------------------------------
const wSeg = 64;
const wRings = 18;
const wPos = [];
const wIdx = [];
for (let ring = 0; ring <= wRings; ring++) {
  const rn = ring / wRings;
  for (let i = 0; i < wSeg; i++) {
    const a = (i / wSeg) * Math.PI * 2;
    const r = pondRadius(a) * rn * 0.995;
    // world-space XZ grid so the outline matches the basin exactly
    wPos.push(Math.cos(a) * r, 0, Math.sin(a) * r);
  }
}
for (let ring = 0; ring < wRings; ring++) {
  for (let i = 0; i < wSeg; i++) {
    const i0 = ring * wSeg + i;
    const i1 = ring * wSeg + ((i + 1) % wSeg);
    const i2 = (ring + 1) * wSeg + i;
    const i3 = (ring + 1) * wSeg + ((i + 1) % wSeg);
    // wound so face normals point up (+Y)
    wIdx.push(i0, i1, i2, i1, i3, i2);
  }
}
const waterSurfaceGeo = new THREE.BufferGeometry();
waterSurfaceGeo.setAttribute('position', new THREE.Float32BufferAttribute(wPos, 3));
waterSurfaceGeo.setIndex(wIdx);
waterSurfaceGeo.computeVertexNormals();
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x0c7d68,
  transparent: true,
  opacity: 0.42,
  roughness: 0.38,
  metalness: 0.0,
  side: THREE.DoubleSide,
  depthWrite: false,
  flatShading: true
});
const water = new THREE.Mesh(waterSurfaceGeo, waterMat);
water.position.y = -0.02;
water.renderOrder = 4;
scene.add(water);

// ------------------------------------------------------------------
// Shore stones & moss
// ------------------------------------------------------------------
const stoneMats = [
  flatMat(0x8a867c), flatMat(0x736f66), flatMat(0x9b968a), flatMat(0x5f5c55)
];
for (let i = 0; i < 64; i++) {
  const a = (i / 64) * Math.PI * 2 + rand(-0.05, 0.05);
  const r = pondRadius(a) + rand(0.35, 1.15);
  const s = rand(0.35, 1.05);
  const g = new THREE.DodecahedronGeometry(s, 0);
  const m = new THREE.Mesh(g, stoneMats[i % stoneMats.length]);
  m.position.set(Math.cos(a) * r, rand(-0.15, 0.12), Math.sin(a) * r);
  m.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
  m.scale.set(rand(0.9, 1.5), rand(0.45, 0.85), rand(0.9, 1.4));
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

for (let i = 0; i < 30; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = pondRadius(a) + rand(0.9, 3.6);
  const g = new THREE.IcosahedronGeometry(rand(0.28, 0.7), 0);
  const m = new THREE.Mesh(g, flatMat(i % 2 ? 0x5f7a3c : 0x6e8a45, { roughness: 1 }));
  m.position.set(Math.cos(a) * r, rand(-0.15, 0.05), Math.sin(a) * r);
  m.scale.set(rand(1.1, 1.9), rand(0.28, 0.5), rand(1.1, 1.8));
  m.rotation.y = rand(0, Math.PI);
  m.receiveShadow = true;
  scene.add(m);
}

// ------------------------------------------------------------------
// Lily pads & reeds
// ------------------------------------------------------------------
function makeLilyPad() {
  const g = new THREE.CircleGeometry(rand(0.45, 0.85), 10);
  const pos = g.attributes.position;
  // notch the pad
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    const ang = Math.atan2(y, x);
    if (Math.abs(ang) < 0.28) {
      pos.setXYZ(i, x * 0.12, y * 0.12, 0);
    }
    pos.setZ(i, Math.sin(ang * 3) * 0.03);
  }
  g.computeVertexNormals();
  return g;
}
const padMat = flatMat(0x4e7d3c, { roughness: 0.75 });
for (let i = 0; i < 9; i++) {
  const a = rand(0, Math.PI * 2);
  const rn = rand(0.68, 0.92);
  const r = pondRadius(a) * rn;
  const pad = new THREE.Mesh(makeLilyPad(), padMat);
  pad.rotation.x = -Math.PI / 2;
  pad.rotation.z = rand(0, Math.PI * 2);
  pad.position.set(Math.cos(a) * r, 0.015, Math.sin(a) * r);
  pad.receiveShadow = true;
  scene.add(pad);
}

function makeReedCluster(x, z) {
  const g = new THREE.Group();
  const count = 4 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const h = rand(1.1, 2.3);
    const stalk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.045, h, 5),
      flatMat(i % 2 ? 0x6f8f42 : 0x5c7a36)
    );
    stalk.position.set(rand(-0.28, 0.28), h / 2 - 0.05, rand(-0.28, 0.28));
    stalk.rotation.z = rand(-0.18, 0.18);
    stalk.rotation.x = rand(-0.18, 0.18);
    stalk.castShadow = true;
    g.add(stalk);
    const blade = new THREE.Mesh(
      new THREE.ConeGeometry(0.07, rand(0.5, 0.95), 4),
      flatMat(0x7fa04c)
    );
    blade.position.copy(stalk.position);
    blade.position.y = h + 0.15;
    blade.rotation.z = stalk.rotation.z * 1.8;
    g.add(blade);
  }
  g.position.set(x, -0.15, z);
  scene.add(g);
}
for (let i = 0; i < 8; i++) {
  const a = rand(0, Math.PI * 2);
  const r = pondRadius(a) + rand(0.25, 0.7);
  makeReedCluster(Math.cos(a) * r, Math.sin(a) * r);
}

// ------------------------------------------------------------------
// Stepping-stone path
// ------------------------------------------------------------------
const stepMat = flatMat(0x9a958a);
for (let i = 0; i < 7; i++) {
  const t = i / 6;
  const x = -13.5 + t * 6.2;
  const z = 11.2 - t * 3.4 + Math.sin(i * 1.4) * 0.55;
  const g = new THREE.CylinderGeometry(rand(0.62, 0.9), rand(0.7, 1.0), rand(0.18, 0.3), 7);
  const m = new THREE.Mesh(g, stepMat);
  m.position.set(x, -0.08 + rand(-0.03, 0.03), z);
  m.rotation.y = rand(0, Math.PI);
  m.scale.set(1, 1, rand(0.85, 1.15));
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}

// ------------------------------------------------------------------
// Curved wooden bridge over a narrow section
// ------------------------------------------------------------------
function buildBridge() {
  const group = new THREE.Group();
  const wood = flatMat(0x4a3526, { roughness: 0.8 });
  const woodDark = flatMat(0x352418, { roughness: 0.85 });

  // arc path across the pond's east narrow arm
  const arcPts = [];
  const arcSegs = 14;
  for (let i = 0; i <= arcSegs; i++) {
    const t = i / arcSegs;
    const x = 6.6 - t * 5.6;
    const z = -6.4 + t * 1.2;
    const y = 0.15 + Math.sin(t * Math.PI) * 1.05;
    arcPts.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(arcPts);

  // deck planks
  const plankCount = 17;
  for (let i = 0; i < plankCount; i++) {
    const t = i / (plankCount - 1);
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t);
    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.1, 2.15), wood);
    plank.position.copy(p);
    plank.lookAt(p.clone().add(tan));
    plank.castShadow = true;
    plank.receiveShadow = true;
    group.add(plank);
  }

  // side beams
  for (const side of [-1, 1]) {
    const beamPts = [];
    for (let i = 0; i <= arcSegs; i++) {
      const t = i / arcSegs;
      const p = curve.getPointAt(t);
      const tan = curve.getTangentAt(t);
      const n = new THREE.Vector3(-tan.z, 0, tan.x).normalize().multiplyScalar(side * 1.02);
      beamPts.push(p.clone().add(n).add(new THREE.Vector3(0, -0.12, 0)));
    }
    const beamCurve = new THREE.CatmullRomCurve3(beamPts);
    const beam = new THREE.Mesh(
      new THREE.TubeGeometry(beamCurve, 20, 0.085, 5, false),
      woodDark
    );
    beam.castShadow = true;
    group.add(beam);

    // railing posts + handrail
    const railPts = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8;
      const p = curve.getPointAt(t);
      const tan = curve.getTangentAt(t);
      const n = new THREE.Vector3(-tan.z, 0, tan.x).normalize().multiplyScalar(side * 1.02);
      const base = p.clone().add(n);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.065, 0.85, 5), woodDark);
      post.position.copy(base).add(new THREE.Vector3(0, 0.32, 0));
      post.castShadow = true;
      group.add(post);
      railPts.push(base.clone().add(new THREE.Vector3(0, 0.74, 0)));
    }
    const railCurve = new THREE.CatmullRomCurve3(railPts);
    const rail = new THREE.Mesh(
      new THREE.TubeGeometry(railCurve, 16, 0.07, 5, false),
      woodDark
    );
    rail.castShadow = true;
    group.add(rail);
  }
  return group;
}
const bridge = buildBridge();
scene.add(bridge);

// ------------------------------------------------------------------
// Stone lantern (tōrō)
// ------------------------------------------------------------------
function buildLantern() {
  const g = new THREE.Group();
  const stone = flatMat(0x8d8a80, { roughness: 0.92 });
  const stoneDark = flatMat(0x6e6b62, { roughness: 0.95 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.95, 0.35, 8), stoneDark);
  base.position.y = 0.17;
  g.add(base);

  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.32, 1.35, 7), stone);
  pillar.position.y = 1.0;
  g.add(pillar);

  const platform = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.72, 0.22, 8), stone);
  platform.position.y = 1.75;
  g.add(platform);

  const firebox = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.72, 0.85), stone);
  firebox.position.y = 2.22;
  g.add(firebox);

  const windowMat = flatMat(0x2a2620, { roughness: 1, emissive: 0xffb060, emissiveIntensity: 0.35 });
  for (const [x, z, ry] of [[0, 0.44, 0], [0, -0.44, 0], [0.44, 0, Math.PI / 2], [-0.44, 0, Math.PI / 2]]) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.38, 0.06), windowMat);
    w.position.set(x, 2.24, z);
    w.rotation.y = ry;
    g.add(w);
  }

  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.05, 0.62, 4), stoneDark);
  roof.position.y = 2.88;
  roof.rotation.y = Math.PI / 4;
  g.add(roof);

  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 5), stone);
  knob.position.y = 3.28;
  g.add(knob);

  g.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  return g;
}
const lantern = buildLantern();
lantern.position.set(-11.2, -0.15, -3.4);
lantern.rotation.y = 0.5;
scene.add(lantern);

// ------------------------------------------------------------------
// Cherry blossom tree
// ------------------------------------------------------------------
function buildCherryTree() {
  const g = new THREE.Group();
  const bark = flatMat(0x3b2a20, { roughness: 0.95 });

  function branch(from, to, r1, r2, depth) {
    const dir = to.clone().sub(from);
    const len = dir.length();
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r2, r1, len, 5), bark);
    mesh.position.copy(from).add(to).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);

    if (depth > 0) {
      const n = 2 + Math.floor(Math.random() * 2);
      for (let i = 0; i < n; i++) {
        const spread = new THREE.Vector3(
          rand(-1, 1), rand(0.35, 1.1), rand(-1, 1)
        ).normalize().multiplyScalar(len * rand(0.6, 0.95));
        const childTo = to.clone().add(spread);
        branch(to, childTo, r2 * 0.72, r2 * 0.4, depth - 1);
      }
    } else {
      // blossom clusters at branch tips
      const clusters = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < clusters; i++) {
        const off = new THREE.Vector3(rand(-0.7, 0.7), rand(-0.2, 0.7), rand(-0.7, 0.7));
        const s = rand(0.65, 1.25);
        const bloom = new THREE.Mesh(
          new THREE.IcosahedronGeometry(s, 0),
          flatMat([0xf2b6c6, 0xe89aaf, 0xf7c8d4, 0xd98aa3][Math.floor(Math.random() * 4)], {
            roughness: 0.9,
            emissive: 0x331018,
            emissiveIntensity: 0.12
          })
        );
        bloom.position.copy(to).add(off);
        bloom.rotation.set(rand(0, 3), rand(0, 3), rand(0, 3));
        bloom.scale.set(rand(1, 1.5), rand(0.65, 1.0), rand(1, 1.5));
        bloom.castShadow = true;
        g.add(bloom);
      }
    }
  }

  branch(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.35, 2.6, 0.2), 0.55, 0.38, 0);
  branch(new THREE.Vector3(0.35, 2.4, 0.2), new THREE.Vector3(1.9, 4.6, -0.6), 0.3, 0.16, 1);
  branch(new THREE.Vector3(0.2, 2.2, 0.15), new THREE.Vector3(-1.7, 4.4, 1.1), 0.28, 0.15, 1);
  branch(new THREE.Vector3(0.3, 2.5, 0.2), new THREE.Vector3(0.4, 5.2, 1.8), 0.26, 0.14, 1);

  return g;
}

      const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.66, 6), mat);
      seg.position.y = i * 0.72 + 0.33;

      node.position.y = i * 0.72 + 0.68;
      stalk.add(node);
    }
    for (let l = 0; l < 5; l++) {

        new THREE.ConeGeometry(0.16, rand(0.7, 1.2), 4),

    stalk.rotation.z = rand(-0.12, 0.12);

const splashes = [];
const ringGeo = new THREE.RingGeometry(0.25, 0.42, 22);
const dropGeo = new THREE.IcosahedronGeometry(0.07, 0);

function spawnSplash(x, z) {
  const group = new THREE.Group();
  group.position.set(x, -0.02, z);

  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0xbfe8e0,
      transparent: true,
      opacity: 0.55,
      side: THREE.DoubleSide,
      depthWrite: false
    }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.03 + i * 0.012;
    ring.userData = { delay: i * 0.16, life: 0, max: 1.05 + i * 0.15, baseScale: 1 + i * 0.25 };
    group.add(ring);
    splashes.push({ mesh: ring, type: 'ring' });
  }

  for (let i = 0; i < 7; i++) {
    const d = new THREE.Mesh(dropGeo, new THREE.MeshStandardMaterial({
      color: 0x9fd6cc,
      transparent: true,
      opacity: 0.85,
      roughness: 0.3,
      depthWrite: false
    }));
    const a = rand(0, Math.PI * 2);
    d.position.set(Math.cos(a) * 0.12, 0.05, Math.sin(a) * 0.12);
    d.userData = {
      vel: new THREE.Vector3(Math.cos(a) * rand(0.5, 1.3), rand(1.2, 2.3), Math.sin(a) * rand(0.5, 1.3)),
      life: 0,
      max: rand(0.55, 0.85)
    };
    group.add(d);
    splashes.push({ mesh: d, type: 'drop' });
  }

  // lingering surface ripple
  for (let i = 0; i < 2; i++) {
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color: 0x7fd0c4,
      transparent: true,
      opacity: 0.3,
      side: THREE.DoubleSide,
      depthWrite: false
    }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    ring.userData = { delay: 0.3 + i * 0.35, life: 0, max: 1.8, baseScale: 1.2 + i * 0.6 };
    group.add(ring);
    splashes.push({ mesh: ring, type: 'ring' });
  }

  scene.add(group);
  setTimeout(() => {
    scene.remove(group);
  }, 2600);
}

function updateSplashes(dt) {
  for (const s of splashes) {
    const u = s.mesh.userData;
    u.life += dt;
    const t = u.life - (u.delay || 0);
    if (t < 0) {
      s.mesh.visible = false;
      continue;
    }
    s.mesh.visible = true;
    if (s.type === 'ring') {
      const k = t / u.max;
      if (k >= 1) { s.mesh.visible = false; continue; }
      const sc = u.baseScale * (0.4 + k * 5.2);
      s.mesh.scale.set(sc, sc, sc);
      s.mesh.material.opacity = (1 - k) * 0.5;
    } else {
      const k = t / u.max;
      if (k >= 1) { s.mesh.visible = false; continue; }
      u.vel.y -= 6.5 * dt;
      s.mesh.position.addScaledVector(u.vel, dt);
      s.mesh.material.opacity = 0.85 * (1 - k);
    }
  }
}

const FISH_COUNT = 6;

function buildFishBodyGeometry() {
  // head at +Z, tail at -Z
  const sections = [
    // z,     halfWidth, halfHeight, yOffset
    [ 1.30, 0.18, 0.085, 0.030],
    [ 1.18, 0.36, 0.135, 0.020],
    [ 1.02, 0.48, 0.185, 0.008],
    [ 0.82, 0.54, 0.235, 0.000],
    [ 0.58, 0.52, 0.275, -0.010],
    [ 0.28, 0.48, 0.295, -0.020],
    [-0.05, 0.41, 0.285, -0.030],
    [-0.40, 0.33, 0.235, -0.035],
    [-0.75, 0.24, 0.175, -0.030],
    [-1.05, 0.16, 0.115, -0.020],
    [-1.28, 0.09, 0.070, -0.005],
    [-1.42, 0.035, 0.030, 0.005]
  ];
  const radial = 8;
  const pos = [];
  const col = [];
  const dark = new THREE.Color(0x4a5240);
  const olive = new THREE.Color(0x6a6e52);
  const belly = new THREE.Color(0xc8bda0);

  for (const [z, w, h, yo] of sections) {
    for (let i = 0; i < radial; i++) {
      const a = (i / radial) * Math.PI * 2 + Math.PI / radial;
      const x = Math.cos(a) * w;
      const y = Math.sin(a) * h + yo;
      pos.push(x, y, z);
      // vertical colour gradient: dark back, light belly
      const ny = Math.sin(a);
      const c = ny > 0
        ? dark.clone().lerp(olive, 0.35 + (1 - ny) * 0.3)
        : olive.clone().lerp(belly, clamp(-ny * 1.25, 0, 1));
      col.push(c.r, c.g, c.b);
    }
  }

  const idx = [];
  const rings = sections.length;
  for (let r = 0; r < rings - 1; r++) {
    for (let i = 0; i < radial; i++) {
      const i0 = r * radial + i;
      const i1 = r * radial + ((i + 1) % radial);
      const i2 = (r + 1) * radial + i;
      const i3 = (r + 1) * radial + ((i + 1) % radial);
      idx.push(i0, i2, i1, i1, i2, i3);
    }
  }
  // cap nose and tail
  const noseIndex = pos.length / 3;
  pos.push(0, 0.03, 1.36);
  col.push(dark.r, dark.g, dark.b);
  for (let i = 0; i < radial; i++) {
    idx.push(noseIndex, i, (i + 1) % radial);
  }
  const tailBase = (rings - 1) * radial;
  const tailIndex = pos.length / 3;
  pos.push(0, 0.005, -1.46);
  col.push(olive.r, olive.g, olive.b);
  for (let i = 0; i < radial; i++) {
    idx.push(tailIndex, tailBase + ((i + 1) % radial), tailBase + i);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function makeBarbel(points, radius) {
  const curve = new THREE.CatmullRomCurve3(points);
  return new THREE.TubeGeometry(curve, 8, radius, 4, false);
}

function buildCatfish(scaleFactor, bodyColorShift) {
  const fish = new THREE.Group();
  const bodyGeo = buildFishBodyGeometry();
  const bodyMat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    flatShading: true,
    roughness: 0.72,
    metalness: 0.05
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true;
  body.receiveShadow = true;
  fish.add(body);

  const finMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0x3f4436).offsetHSL(bodyColorShift, 0, 0),
    flatShading: true,
    roughness: 0.8,
    side: THREE.DoubleSide
  });
  const bellyFinMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0x6a6552).offsetHSL(bodyColorShift, 0, 0),
    flatShading: true,
    roughness: 0.8,
    side: THREE.DoubleSide
  });

  // pectoral fins
  for (const side of [-1, 1]) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(0.62, -0.18);
    shape.lineTo(0.55, -0.42);
    shape.lineTo(0.08, -0.22);
    shape.closePath();
    const g = new THREE.ShapeGeometry(shape);
    g.rotateX(-Math.PI / 2);
    const fin = new THREE.Mesh(g, finMat);
    fin.position.set(side * 0.42, -0.02, 0.62);
    fin.rotation.z = side * -0.55;
    fin.rotation.y = side * 0.35;
    fin.userData.fin = 'pectoral';
    fin.userData.side = side;
    fish.add(fin);
  }

  // dorsal fin
  {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(0.18, 0.38);
    shape.lineTo(-0.22, 0.34);
    shape.lineTo(-0.28, 0);
    shape.closePath();
    const g = new THREE.ShapeGeometry(shape);
    const fin = new THREE.Mesh(g, finMat);
    fin.position.set(0, 0.22, 0.12);
    fin.userData.fin = 'dorsal';
    fish.add(fin);
  }

  // elongated anal fin
  {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(0.15, -0.3);
    shape.lineTo(-0.95, -0.26);
    shape.lineTo(-1.05, -0.02);
    shape.closePath();
    const g = new THREE.ShapeGeometry(shape);
    const fin = new THREE.Mesh(g, bellyFinMat);
    fin.position.set(0, -0.2, -0.35);
    fin.userData.fin = 'anal';
    fish.add(fin);
  }

  // tail fin (slightly forked)
  {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(-0.62, 0.42);
    shape.lineTo(-0.48, 0.08);
    shape.lineTo(-0.58, -0.34);
    shape.lineTo(0, -0.06);
    shape.closePath();
    const g = new THREE.ShapeGeometry(shape);
    const fin = new THREE.Mesh(g, finMat);
    fin.position.set(0, 0, -1.42);
    fin.userData.fin = 'tail';
    fish.add(fin);
  }

  // eyes
  const eyeMat = new THREE.MeshStandardMaterial({
    color: 0x120e0a,
    roughness: 0.35,
    metalness: 0.1
  });
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 5), eyeMat);
    eye.position.set(side * 0.30, 0.075, 1.02);
    fish.add(eye);
  }

  // wide mouth
  {
    const mouth = new THREE.Mesh(
      new THREE.BoxGeometry(0.52, 0.045, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x241c16, roughness: 0.85 })
    );
    mouth.position.set(0, -0.035, 1.22);
    mouth.rotation.x = 0.22;
    fish.add(mouth);
  }

  // barbels — long whiskers around the mouth
  const barbelMat = new THREE.MeshStandardMaterial({
    color: 0x2e2820,
    flatShading: true,
    roughness: 0.85
  });
  const barbelSets = [
    // upper pair — long, sweeping back
    [[0.18, 0.02, 1.22], [0.55, -0.02, 0.72], [0.82, -0.12, 0.05], [0.92, -0.22, -0.6]],
    [[-0.18, 0.02, 1.22], [-0.55, -0.02, 0.72], [-0.82, -0.12, 0.05], [-0.92, -0.22, -0.6]],
    // lower pair — medium
    [[0.16, -0.06, 1.24], [0.42, -0.18, 0.88], [0.58, -0.32, 0.42]],
    [[-0.16, -0.06, 1.24], [-0.42, -0.18, 0.88], [-0.58, -0.32, 0.42]],
    // chin pair — short
    [[0.08, -0.08, 1.28], [0.18, -0.28, 1.02], [0.22, -0.42, 0.72]],
    [[-0.08, -0.08, 1.28], [-0.18, -0.28, 1.02], [-0.22, -0.42, 0.72]]
  ];
  for (const pts of barbelSets) {
    const curvePts = pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const mesh = new THREE.Mesh(makeBarbel(curvePts, 0.018), barbelMat);
    fish.add(mesh);
  }

  fish.scale.setScalar(scaleFactor);

  // store base geometry data for swimming bend
  fish.userData.body = body;
  fish.userData.basePositions = bodyGeo.attributes.position.array.slice();

  return fish;
}

// Fish behaviour state
const fishes = [];
const fishConfigs = [
  { scale: 1.45, speed: 1.25, depth: [-1.15, -0.55], colorShift: 0.0,  phase: 0.0 },
  { scale: 1.05, speed: 1.55, depth: [-1.35, -0.7],  colorShift: 0.03, phase: 1.7 },
  { scale: 0.92, speed: 1.7,  depth: [-1.05, -0.35], colorShift: -0.02, phase: 3.1 },
  { scale: 0.8,  speed: 1.85, depth: [-1.3, -0.6],   colorShift: 0.05, phase: 4.4 },
  { scale: 0.72, speed: 1.95, depth: [-0.95, -0.28], colorShift: -0.04, phase: 5.2 },
  { scale: 0.62, speed: 2.1,  depth: [-1.25, -0.5],  colorShift: 0.02, phase: 0.9 }
];

for (let i = 0; i < FISH_COUNT; i++) {
  const cfg = fishConfigs[i];
  const mesh = buildCatfish(cfg.scale, cfg.colorShift);
  const a = (i / FISH_COUNT) * Math.PI * 2 + rand(0, 0.8);
  const r = rand(2.2, 5.4);
  const pos = new THREE.Vector3(
    Math.cos(a) * r,
    rand(cfg.depth[0], cfg.depth[1]),
    Math.sin(a) * r
  );
  mesh.position.copy(pos);
  scene.add(mesh);

  const heading = rand(0, Math.PI * 2);
  fishes.push({
    mesh,
    pos,
    vel: new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading)).multiplyScalar(cfg.speed * 0.4),
    speed: cfg.speed,
    depthMin: cfg.depth[0],
    depthMax: cfg.depth[1],
    preferredDepth: rand(cfg.depth[0], cfg.depth[1]),
    wanderAngle: heading,
    wanderTimer: rand(1, 4),
    pauseTimer: 0,
    bodyPhase: cfg.phase,
    bodyAmp: 0.09 / Math.max(cfg.scale, 0.4),
    finPhase: rand(0, Math.PI * 2),
    surfaceTimer: rand(12, 32),
    state: 'swim',
    stateTimer: 0,
    bubbleTarget: new THREE.Vector3(),
    index: i
  });
}

function updateFishes(dt, elapsed) {
  const tmp = new THREE.Vector3();
  const desired = new THREE.Vector3();

  for (const f of fishes) {
    // ---- state machine ----
    f.surfaceTimer -= dt;
    if (f.state === 'swim' && f.surfaceTimer <= 0) {
      f.state = 'surface';
      f.stateTimer = 0;
      const a = rand(0, Math.PI * 2);
      const r = pondRadius(a) * rand(0.35, 0.6);
      f.bubbleTarget.set(Math.cos(a) * r, -0.12, Math.sin(a) * r);
      f.surfaceTimer = rand(18, 42);
    }

    if (f.state === 'surface') {
      f.stateTimer += dt;
      desired.copy(f.bubbleTarget).sub(f.pos);
      const dist = desired.length();
      if (dist < 0.35 || f.stateTimer > 7) {
        if (f.pos.y > -0.45) {
          spawnSplash(f.pos.x, f.pos.z);
        }
        f.state = 'descend';
        f.stateTimer = 0;
        f.preferredDepth = rand(f.depthMin, f.depthMax);
      } else {
        desired.normalize().multiplyScalar(f.speed * 1.35);
      }
    } else if (f.state === 'descend') {
      f.stateTimer += dt;
      if (f.stateTimer > 3.2 || f.pos.y < f.preferredDepth + 0.15) {
        f.state = 'swim';
        f.stateTimer = 0;
      }
      tmp.set(f.pos.x, f.preferredDepth, f.pos.z).sub(f.pos);
      desired.copy(tmp).normalize().multiplyScalar(f.speed * 0.85);
    } else {
      // ---- wander ----
      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderAngle += rand(-1.15, 1.15);
        f.wanderTimer = rand(1.6, 4.2);
        if (Math.random() < 0.16) {
          f.pauseTimer = rand(0.5, 1.5);
        }
        if (Math.random() < 0.22) {
          f.preferredDepth = rand(f.depthMin, f.depthMax);
        }
      }

      if (f.pauseTimer > 0) {
        f.pauseTimer -= dt;
        desired.set(0, 0, 0);
      } else {
        desired.set(Math.cos(f.wanderAngle), 0, Math.sin(f.wanderAngle));
      }

      // depth steering
      const depthDiff = f.preferredDepth - f.pos.y;
      desired.y = clamp(depthDiff * 0.7, -0.7, 0.7);

      // avoid pond edge
      const radial = tmp.set(f.pos.x, 0, f.pos.z);
      const rLen = radial.length();
      const maxR = pondRadius(Math.atan2(f.pos.z, f.pos.x)) * 0.82;
      if (rLen > maxR) {
        radial.normalize();
        desired.addScaledVector(radial, -(rLen - maxR) * 1.4);
        f.wanderAngle = Math.atan2(-radial.z, -radial.x) + rand(-0.6, 0.6);
      }

      // avoid bottom
      const bottomY = basinDepth(Math.min(rLen / Math.max(pondRadius(Math.atan2(f.pos.z, f.pos.x)), 0.01), 1));
      if (f.pos.y < bottomY + 0.55) {
        desired.y += (bottomY + 0.55 - f.pos.y) * 2.4;
      }

      // avoid surface (except during surface state)
      if (f.pos.y > -0.42) {
        desired.y -= (f.pos.y + 0.42) * 2.8;
      }

      desired.normalize().multiplyScalar(f.speed);
    }

    // separation from other fish
    for (const o of fishes) {
      if (o === f) continue;
      tmp.copy(f.pos).sub(o.pos);
      const d = tmp.length();
      const minSep = 1.5 * (f.mesh.scale.x + o.mesh.scale.x) * 0.55;
      if (d < minSep && d > 0.001) {
        desired.addScaledVector(tmp.normalize(), (minSep - d) * 1.7);
      }
    }

    // steering
    const steer = desired.sub(f.vel);
    const maxForce = 3.2;
    if (steer.length() > maxForce) steer.setLength(maxForce);
    f.vel.addScaledVector(steer, dt * 1.6);

    // speed clamp
    const spd = f.vel.length();
    const maxSpd = f.state === 'swim' ? f.speed * 1.1 : f.speed * 1.55;
    if (spd > maxSpd) f.vel.setLength(maxSpd);
    if (spd < 0.05 && f.pauseTimer <= 0) {
      f.vel.setLength(Math.min(0.25, maxSpd));
    }

    f.pos.addScaledVector(f.vel, dt);

    // hard bounds
    const rr = Math.sqrt(f.pos.x * f.pos.x + f.pos.z * f.pos.z);
    const hardMax = pondRadius(Math.atan2(f.pos.z, f.pos.x)) * 0.88;
    if (rr > hardMax) {
      const s = hardMax / rr;
      f.pos.x *= s;
      f.pos.z *= s;
      f.vel.x *= -0.35;
      f.vel.z *= -0.35;
    }
    const minY = basinDepth(Math.min(rr / Math.max(pondRadius(Math.atan2(f.pos.z, f.pos.x)), 0.01), 1)) + 0.35;
    if (f.pos.y < minY) f.pos.y = minY;
    if (f.pos.y > -0.12) f.pos.y = -0.12;

    // ---- orientation ----
    if (f.vel.lengthSq() > 0.0001) {
      const look = tmp.copy(f.pos).add(f.vel);
      f.mesh.lookAt(look);
    }
    // slight roll into turns
    f.mesh.rotation.z += (clamp(-f.vel.x * 0.04, -0.18, 0.18) - f.mesh.rotation.z) * dt * 2;

    // ---- body undulation ----
    const body = f.mesh.userData.body;
    const base = f.mesh.userData.basePositions;
    const posAttr = body.geometry.attributes.position;
    const arr = posAttr.array;
    const phase = elapsed * (2.1 + f.speed * 0.35) + f.bodyPhase;
    const amp = f.bodyAmp * (0.75 + Math.min(f.vel.length(), 1.6) * 0.35);

    for (let i = 0; i < arr.length; i += 3) {
      const bz = base[i + 2];
      const t = clamp((1.36 - bz) / 2.85, 0, 1); // 0 head → 1 tail
      const bend = Math.sin(phase + t * Math.PI * 1.7) * amp * t * t;
      arr[i] = base[i] + bend;
      arr[i + 1] = base[i + 1] + Math.sin(phase * 0.6 + t * 2.0) * 0.012 * t;
      arr[i + 2] = base[i + 2];
    }
    posAttr.needsUpdate = true;

    // ---- fin flutter ----
    f.finPhase += dt * (2.4 + f.speed * 0.4);
    f.mesh.traverse(obj => {
      if (!obj.isMesh || !obj.userData.fin) return;
      const w = Math.sin(f.finPhase) ;
      if (obj.userData.fin === 'pectoral') {
        obj.rotation.x = w * 0.22;
      } else if (obj.userData.fin === 'dorsal') {
        obj.rotation.x = w * 0.1;
      } else if (obj.userData.fin === 'anal') {
        obj.rotation.x = w * 0.14;
      } else if (obj.userData.fin === 'tail') {
        obj.rotation.y = Math.sin(phase + 1.2) * 0.34;
      }
    });
  }
}

// ------------------------------------------------------------------
// Animation loop
// ------------------------------------------------------------------
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // water ripples (geometry is in world XZ; Y is the wave height)
  const wPosAttr = waterSurfaceGeo.attributes.position;
  const wArr = wPosAttr.array;
  for (let i = 0; i < wArr.length; i += 3) {
    const x = wArr[i];
    const z = wArr[i + 2];
    wArr[i + 1] =
      Math.sin(x * 0.55 + elapsed * 1.15) * 0.055 +
      Math.sin(z * 0.72 + elapsed * 1.45) * 0.045 +
      Math.sin((x + z) * 0.32 + elapsed * 0.75) * 0.035;
  }
  wPosAttr.needsUpdate = true;

  // gentle material shimmer
  waterMat.opacity = 0.42 + Math.sin(elapsed * 0.6) * 0.022;

  // petals
  for (const p of petals) {
    const u = p.userData;
    p.position.y -= u.speed * dt;
    p.position.x += Math.sin(elapsed * u.swaySpeed + u.phase) * u.sway * dt;
    p.position.z += Math.cos(elapsed * u.swaySpeed * 0.8 + u.phase) * u.sway * 0.7 * dt;
    p.rotation.x += u.spin.x * dt;
    p.rotation.y += u.spin.y * dt;
    p.rotation.z += u.spin.z * dt;
    if (p.position.y < -0.2) {
      p.position.set(rand(-16, 16), rand(9, 13), rand(-16, 16));
    }
    // keep petals over the diorama
    const d = Math.sqrt(p.position.x * p.position.x + p.position.z * p.position.z);
    if (d > 17) {
      p.position.x *= 0.85;
      p.position.z *= 0.85;
    }
  }

  updateFishes(dt, elapsed);
  updateSplashes(dt);

  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

// ------------------------------------------------------------------
// Resize
// ------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
